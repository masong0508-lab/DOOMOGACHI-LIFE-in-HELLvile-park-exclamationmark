name: PS2 EE bootstrap
on:
  push:
    paths:
      - 'ps2/**'
      - '.github/workflows/ps2.yml'
  pull_request:
    paths:
      - 'ps2/**'
      - '.github/workflows/ps2.yml'
  workflow_dispatch:

jobs:
  padmap-host:
    name: PS2 pad semantics (host, 16 buttons)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute all pad mapping cases
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -Icore/include -Ips2/src \
            ps2/src/padmap.c ps2/tests/padmap_test.c -o /tmp/ps2-padmap-test
          /tmp/ps2-padmap-test
      - name: Verify fast indexed sprites against the host oracle
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -Ips2/src \
            ps2/tests/indexed_blit_test.c -o /tmp/ps2-blit-test
          /tmp/ps2-blit-test
      - name: Verify PS2 real map rendering stays in sync with host
        run: python3 ps2/tests/check_reference_parity.py

  ps2-elf:
    name: PS2 ELF (EE/gsKit/PADMAN)
    runs-on: ubuntu-24.04
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain and build a real PS2 EE ELF
        run: |
          set -eu
          : "${PS2DEV:?PS2DEV is required}"
          : "${PS2SDK:?PS2SDK is required}"
          : "${GSKIT:?GSKIT is required}"
          command -v mips64r5900el-ps2-elf-gcc
          test -f "$PS2DEV/share/ps2dev.cmake" || test -f "$PS2SDK/ps2dev.cmake"
          if test -f "$PS2DEV/share/ps2dev.cmake"; then
            TC="$PS2DEV/share/ps2dev.cmake"
          else
            TC="$PS2SDK/ps2dev.cmake"
          fi
          # The upstream image's final stage is Alpine and deliberately
          # includes only runtimes + cross tools (neither make nor cmake).
          # Install a tiny native build driver, not a second EE toolchain.
          apk add --no-cache make
          make -C ps2 -j2
          test -s ps2/build/doomogachi_ps2.elf
          mips64r5900el-ps2-elf-readelf -h ps2/build/doomogachi_ps2.elf
          printf 'commit=%s\nrepo=%s\nps2_phase=PS2-0\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" > ps2/build/BUILD_SOURCE.txt
      - name: Experimental PS2-1 linked shared-game ELF
        # Keep PS2-0 release gate separate from this newly ported backend.
        # A failure appears visibly in this step and the run summary.
        continue-on-error: true
        run: |
          set -eu
          if make -C ps2 game -j2 > /tmp/ps2-game-link.log 2>&1; then
            echo 'PS2 shared-core game: EE ELF linked' >> "$GITHUB_STEP_SUMMARY"
            ls -lh ps2/build/doomogachi_ps2_game.elf
          else
            echo 'PS2 shared-core game link errors (prototype):' >> "$GITHUB_STEP_SUMMARY"
            tail -n 45 /tmp/ps2-game-link.log | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload experimental game ELF only if linked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doomogachi-ps2-game-prototype
          path: ps2/build/doomogachi_ps2_game.elf
          if-no-files-found: ignore
      - name: Upload PS2 ELF for PCSX2 and homebrew launchers
        uses: actions/upload-artifact@v4
        with:
          name: doomogachi-ps2-bootstrap-elf
          path: |
            ps2/build/doomogachi_ps2.elf
            ps2/build/BUILD_SOURCE.txt
          if-no-files-found: error
