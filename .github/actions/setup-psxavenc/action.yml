# Build psxavenc (the .STR / XA encoder) from source at a pinned commit and put it on PATH.
# ps1/CMakeLists.txt uses it to turn trailer/assets/dippinn_logo.mp4 into INTRO.STR, the boot FMV.
# Without it the intro is left out of the disc, so the PS1 jobs also pass -DDOOMO_INTRO_REQUIRED=ON.
name: Set up psxavenc
description: Build psxavenc at a pinned commit (meson + the distro's ffmpeg libraries) and add it to PATH.

inputs:
  commit:
    description: psxavenc commit to build (full 40-character SHA).
    required: true

runs:
  using: composite
  steps:
    # The encoder is pinned by commit and the runner image is fixed to Ubuntu 24.04.
    # Cache the installed binary so normal PS1 builds do not apt-update and rebuild it.
    - name: Restore psxavenc
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/psxavenc
        key: psxavenc-v1-${{ inputs.commit }}-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04

    - name: Install meson and the ffmpeg development libraries
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          meson ninja-build pkg-config gcc \
          libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev

    - name: Fetch psxavenc
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: WonderfulToolchain/psxavenc
        ref: ${{ inputs.commit }}
        path: .psxavenc-src
        persist-credentials: false

    - name: Build and export psxavenc
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        meson setup .psxavenc-src/build .psxavenc-src --buildtype=release
        ninja -C .psxavenc-src/build
        install -D .psxavenc-src/build/psxavenc "$HOME/psxavenc/bin/psxavenc"
        echo "$HOME/psxavenc/bin" >> "$GITHUB_PATH"
        # psxavenc -V prints its version but exits 1, so read the text instead of the status.
        "$HOME/psxavenc/bin/psxavenc" -V 2>&1 || true

    # A cache hit skips the -dev install above, but the cached binary is dynamically linked to the
    # distro's ffmpeg runtime libraries (libavformat.so.60 ...), which a fresh runner lacks.
    - name: Install the ffmpeg runtime libraries psxavenc links against
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          libavformat60 libavcodec60 libavutil58 libswresample4 libswscale7

    - name: Verify cached or freshly built psxavenc
      shell: bash
      run: |
        set -euo pipefail
        test -x "$HOME/psxavenc/bin/psxavenc"
        echo "$HOME/psxavenc/bin" >> "$GITHUB_PATH"
        # psxavenc -V prints "psxavenc <version>" but exits 1 (that is how upstream behaves), so a
        # plain call under set -e kills the job. Capture the text, ignore the status, and require
        # the banner: a binary that cannot even start still fails here.
        ver=$("$HOME/psxavenc/bin/psxavenc" -V 2>&1 || true)
        echo "$ver"
        case "$ver" in
          psxavenc*) ;;
          *) echo "::error::psxavenc did not print its version banner"; exit 1 ;;
        esac
